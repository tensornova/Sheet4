name: Build and Release EXE

on:
  push:
    tags:
      - 'v*' # Trigger the workflow only when pushing a version tag (e.g., v1.0)

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller numpy matplotlib

    - name: Build EXE using PyInstaller
      run: |
        # --onefile: Creates a single executable file
        # --windowed: Hides the console window (GUI only)
        pyinstaller --noconfirm --onefile --windowed --name "Linear_Solver" numerical5.py

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/Linear_Solver.exe
