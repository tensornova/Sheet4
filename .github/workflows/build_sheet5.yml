name: Build and Release EXE

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller numpy matplotlib

    - name: Build EXE using PyInstaller
      run: |
        pyinstaller --noconfirm --onefile --windowed --name "Linear_Solver" numerical5.py

    # خطوة حفظ الملف كـ Artifact (للتحميل المباشر من صفحة Actions)
    - name: Upload EXE as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Linear_Solver_App
        path: dist/Linear_Solver.exe

    # خطوة رفع الملف إلى الـ Release
    - name: Create or Update Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: dist/Linear_Solver.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
