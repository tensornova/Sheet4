name: Build Single EXE

on:
  workflow_dispatch: # يتيح لك تشغيله بضغطة زر واحدة دون عمل Tag أو Commit جديد

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Requirements
      run: |
        pip install pyinstaller numpy matplotlib

    - name: Build Single EXE File
      run: |
        pyinstaller --noconfirm --onefile --windowed --name "Linear_Solver" numerical5.py

    - name: Upload Single EXE to Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: sheet5-exe
        name: "Sheet 5 Single Executable"
        files: dist/Linear_Solver.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
