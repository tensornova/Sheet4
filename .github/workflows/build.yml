name: Build Single EXE
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install & Build Single EXE
        run: |
          pip install pyinstaller numpy matplotlib
          pyinstaller --noconsole --onefile numerical4.py
      - name: Create Direct Download Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          files: dist/numerical4.exe
